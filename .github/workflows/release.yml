name: Release

# Pushes to master are tested and released; pull requests are only tested. A release bumps the minor version, or the
# patch with --patch in the commit message; --no-version skips it.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Proliminal.Sill.Teamwork.slnx -c Release

      - name: Determine version
        id: version
        if: github.event_name == 'push'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          has_flag() { grep -Eq -- "(^|[[:space:]])$1([[:space:]]|\$)" <<< "$COMMIT_MESSAGE"; }

          if has_flag --no-version; then
            exit 0
          fi

          previous=$(git tag --list 'v*' --sort=-v:refname | head -n 1)

          if [ -z "$previous" ]; then
            version=$(dotnet msbuild src/TeamworkTimer/TeamworkTimer.csproj -getProperty:Version)
          else
            IFS=. read -r major minor patch <<< "${previous#v}"
            if has_flag --patch; then version="$major.$minor.$((patch + 1))"; else version="$major.$((minor + 1)).0"; fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Package
        if: steps.version.outputs.version
        run: |
          dotnet build src/TeamworkTimer/TeamworkTimer.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o "$RUNNER_TEMP/plugin"
          rm -f "$RUNNER_TEMP"/plugin/Proliminal.Sill.Sdk.*
          (cd "$RUNNER_TEMP/plugin" && zip -q "$GITHUB_WORKSPACE/TeamworkTimer.zip" ./*)

      - name: Create release
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          range=${PREVIOUS:+$PREVIOUS..HEAD}
          git log --no-merges --format='- %s' ${range:--1} | sed -E 's/ --(patch|no-version)( |$)/\2/g' > notes.md

          gh release create "v$VERSION" TeamworkTimer.zip \
            --target "$GITHUB_SHA" \
            --title "Teamwork timer v$VERSION" \
            --notes-file notes.md \
            --latest
