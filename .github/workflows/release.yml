name: Release

# Every push to main is tested and released, built against the SDK of the latest Sill release, so the plugin loads in
# the Sill people have. A release bumps the minor of the highest release (1.2.0 -> 1.3.0); the first one is the version
# in TeamworkTimer.csproj. Its notes are the subjects of the commits since the previous release. Flags anywhere in the
# head commit message, as separate words, change that:
#   --patch       bumps the patch instead (1.2.0 -> 1.2.1)
#   --no-version  skips the release
# Pull requests are only tested.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # All of the history and tags, for the previous release and the commits since.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Sill's releases are tagged on the SDK commit they were built from, in its public repository.
      - name: Build the SDK of the latest Sill release
        run: |
          tag=$(gh release view --repo proliminal/sill --json tagName -q .tagName)
          echo "Building against the SDK of Sill $tag"
          git clone --quiet --depth 1 --branch "$tag" https://github.com/proliminal/sill.git "$RUNNER_TEMP/sill"
          dotnet build "$RUNNER_TEMP/sill/Proliminal.Sill.Sdk/Proliminal.Sill.Sdk.csproj" -c Release -o "$RUNNER_TEMP/sdk"
          echo "SILL_SDK=$RUNNER_TEMP/sdk/Proliminal.Sill.Sdk.dll" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test Proliminal.Sill.Teamwork.slnx -c Release -p:SillSdk="$SILL_SDK"

      - name: Determine version
        id: version
        if: github.event_name == 'push'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          has_flag() { grep -Eq -- "(^|[[:space:]])$1([[:space:]]|\$)" <<< "$COMMIT_MESSAGE"; }

          if has_flag --no-version; then
            echo "Skipping the release, as asked."
            exit 0
          fi

          previous=$(git tag --list 'v*' --sort=-v:refname | head -n 1)

          if [ -z "$previous" ]; then
            version=$(dotnet msbuild src/TeamworkTimer/TeamworkTimer.csproj -getProperty:Version -p:SillSdk="$SILL_SDK")
          else
            IFS=. read -r major minor patch <<< "${previous#v}"
            if has_flag --patch; then version="$major.$minor.$((patch + 1))"; else version="$major.$((minor + 1)).0"; fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      # The plugin's folder as Sill loads it, zipped: unzipped into %APPDATA%\Proliminal\Sill\plugins\TeamworkTimer. The
      # SDK stays out, as Sill has its own.
      - name: Package
        if: steps.version.outputs.version
        run: |
          dotnet build src/TeamworkTimer/TeamworkTimer.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -p:SillSdk="$SILL_SDK" -o "$RUNNER_TEMP/plugin"
          rm -f "$RUNNER_TEMP"/plugin/Proliminal.Sill.Sdk.*
          (cd "$RUNNER_TEMP/plugin" && zip -q "$GITHUB_WORKSPACE/TeamworkTimer.zip" ./*)

      # A line per commit since the previous release, without merges and flags.
      - name: Create release
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          range=${PREVIOUS:+$PREVIOUS..HEAD}
          git log --no-merges --format='- %s' ${range:--1} | sed -E 's/ --(patch|no-version)( |$)/\2/g' > notes.md

          gh release create "v$VERSION" TeamworkTimer.zip \
            --target "$GITHUB_SHA" \
            --title "Teamwork timer v$VERSION" \
            --notes-file notes.md \
            --latest
